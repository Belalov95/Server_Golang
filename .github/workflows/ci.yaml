name: Go CI

on:
  push:
    branches: ["db"]
  pull_request:
    branches: ["db"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - run: go mod download

      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - run: go mod download

      - uses: golangci/golangci-lint-action@v4
        with:
          version: v1.64.8
          args: --modules-download-mode=readonly ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - run: go mod download

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./... 

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    env:
      DB_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

    services:
      postgres:
        image: postgres:14.10-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - run: go mod download

      - name: Install mockgen
        run: go install github.com/golang/mock/mockgen@v1.6.0

      - name: Generate mocks
        run: |
          mockgen -source=internal/repository/interface.go \
                  -destination=internal/mocks/goods_mock.go \
                  -package=mocks

      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            if pg_isready -h localhost -U postgres -d postgres; then
              echo "Postgres is ready!"
              exit 0
            fi
            echo "Waiting for Postgres ($i/15)..."
            sleep 5
          done
          exit 1

      - name: Run migrations
        run: go run ./cmd/migrate/main.go
        env:
          DB_URL: ${{ env.DB_URL }}

      - name: Run integration tests
        run: go test -v ./integration/... -args -integration
        env:
          DB_URL: ${{ env.DB_URL }}
